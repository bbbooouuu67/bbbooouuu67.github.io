---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y年%-m月%-d日' }}</time>
    {% if page.last_modified_at %} ／ 更新 {{ page.last_modified_at | date: '%Y年%-m月%-d日' }}{% endif %}
  </p>
  {% unless page.pr == false %}{% include pr-notice.html %}{% endunless %}
  {{ content }}
</article>
<p><a href="{{ '/' | relative_url }}">← 記事一覧へ</a></p>
