<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">記事一覧</a>
        <a href="{{ '/about/' | relative_url }}">運営者について</a>
        <a href="{{ '/privacy/' | relative_url }}">プライバシーポリシー・広告について</a>
        <a href="https://note.com/bbbooouuu67">note</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>当サイトはアフィリエイトプログラムを利用して商品を紹介しています。くわしくは<a href="{{ '/privacy/' | relative_url }}">広告について</a>をご覧ください。</p>
      <p>犬の健康や病気のことで気になる点があるときは、かかりつけの動物病院に相談してください。</p>
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
