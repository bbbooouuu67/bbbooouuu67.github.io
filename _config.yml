# サイトの基本設定（藤村さんが書き換えてOKな所には ★ をつけています）
title: "ペキニーズとごはん日記"        # ★ サイト名
description: "ドライフードを食べないペキニーズと暮らす飼い主が、ごはん・おやつ・グッズを正直に記録するブログ。"  # ★ サイトの説明
author: "藤村"                         # ★ 表示する運営者名（ニックネームでもOK）
lang: ja
